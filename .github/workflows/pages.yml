name: Deploy literature dashboard to GitHub Pages

on:
  # The daily monitor commits generated files with GITHUB_TOKEN. GitHub does
  # not emit a new push-triggered workflow for that commit, so deploy from the
  # monitor's completed workflow instead.
  workflow_run:
    workflows:
      - "Daily PopPK × AI literature monitor"
    types:
      - completed
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the latest dashboard from main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate static site
        shell: bash
        run: |
          python -m json.tool docs/articles.json > /dev/null
          node --check docs/assets/app.js
          python -m unittest discover -s tests -p "test_site_generator.py" -v

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
