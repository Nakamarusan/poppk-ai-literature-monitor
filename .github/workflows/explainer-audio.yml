name: Build two-voice explainer narration

on:
  workflow_dispatch:
  push:
    branches: [media/duet-explainer]
    paths:
      - video/narration.json
      - video/build_narration.py
      - .github/workflows/explainer-audio.yml

permissions:
  contents: read

concurrency:
  group: explainer-narration
  cancel-in-progress: true

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech and audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile
      - name: Generate the two-speaker narration
        env:
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '2'
        run: python video/build_narration.py
      - name: Verify real audio was produced
        run: |
          ffprobe -v error -show_entries format=duration -of default=nw=1 video/output/narration.wav
          python -m json.tool video/output/timing.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-english-duet-audio
          path: video/output/
          if-no-files-found: error
          retention-days: 7
