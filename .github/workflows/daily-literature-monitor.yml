name: Daily PopPK × AI literature monitor

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Tokyo"
    - cron: "20 7 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Number of recent days to search (1-90)"
        required: false
        default: "8"
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-literature-monitor.yml"
      - "README.md"
      - "config.json"
      - "docs/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/daily-literature-monitor.yml"
      - "README.md"
      - "config.json"
      - "docs/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: poppk-ai-literature-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scheduled and manual runs must start from the newest main branch.
      - name: Sync latest main branch
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Pushes and pull requests validate code without creating alerts.
      - name: Search, summarize, and notify
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '' }}
          SKIP_IF_SUCCESS_TODAY: ${{ github.event_name == 'schedule' && github.event.schedule == '20 7 * * *' && 'true' || 'false' }}
        run: python -m src.literature_monitor

      - name: Build GitHub Pages data
        run: python -m src.site_generator

      - name: Commit generated outputs
        if: ${{ github.event_name != 'pull_request' && always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data state reports docs)" ]; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state reports docs
          git commit -m "Update literature monitor outputs"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
