name: Build site explainer video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/explainer.yml'

permissions:
  contents: read

concurrency:
  group: site-explainer-media
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install 'kokoro-onnx==0.4.9' 'soundfile>=0.12,<0.14' 'numpy>=2,<3' 'Pillow>=11,<13'
      - name: Download open speech model and stock voices
        shell: bash
        run: |
          mkdir -p .models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl --fail --location --retry 3 "$base/kokoro-v1.0.onnx" -o .models/kokoro-v1.0.onnx
          curl --fail --location --retry 3 "$base/voices-v1.0.bin" -o .models/voices-v1.0.bin
      - name: Synthesize distinct English dialogue
        run: python explainer/voiceover.py
      - name: Save timed narration for video composition
        uses: actions/upload-artifact@v4
        with:
          name: site-explainer-media
          path: build/explainer/
          retention-days: 7
          if-no-files-found: error
